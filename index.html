<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>司法書士 肢別ドリル</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #1e3a8a;
      --primary-light: #eff6ff;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --ng: #b91c1c;
      --ng-bg: #fee2e2;
      --border: #e2e8f0;
      --star: #d97706;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--primary);
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 700; }
    header button {
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    main { max-width: 680px; margin: 0 auto; padding: 14px; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
      border: 1px solid var(--border);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }
    .stat-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 6px;
    }
    .stat-num { font-size: 20px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 11px; color: var(--muted); }
    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin: 12px 0 6px;
    }
    select {
      width: 100%;
      padding: 11px 12px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      flex: 1 1 45%;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }
    .chip.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-primary {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.45; }
    .btn-sub {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
    }

    /* クイズ画面 */
    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.2s ease;
    }
    .star-btn {
      border: none;
      background: none;
      font-size: 22px;
      cursor: pointer;
      color: #cbd5e1;
      padding: 0 4px;
    }
    .star-btn.on { color: var(--star); }
    .q-text {
      font-size: 16px;
      font-weight: 600;
      margin: 8px 0 4px;
      white-space: pre-wrap;
    }
    .ox-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .btn-ox {
      padding: 18px 0;
      font-size: 26px;
      font-weight: 800;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    .btn-o { color: var(--ok); border-color: #86efac; background: #f0fdf4; }
    .btn-x { color: var(--ng); border-color: #fca5a5; background: #fef2f2; }
    .result-box {
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
    }
    .result-box.ok { background: var(--ok-bg); color: var(--ok); }
    .result-box.ng { background: var(--ng-bg); color: var(--ng); }
    .result-title { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .explain-card {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      font-size: 14px;
    }
    .ref-tag {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-issue {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .hidden { display: none !important; }
    .error-msg {
      background: var(--ng-bg);
      color: var(--ng);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>司法書士 肢別ドリル</h1>
    <button id="homeBtn" class="hidden" onclick="showHome()">メニュー</button>
  </header>

  <main>
    <div id="errorArea" class="error-msg hidden"></div>

    <!-- メニュー画面 -->
    <section id="homeView">
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-num" id="statTotal">0</div>
            <div class="stat-label">登録問題数</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="statRate">-</div>
            <div class="stat-label">直近正答率</div>
          </div>
          <div class="stat-box">
            <div class="stat-num" id="statWrong">0</div>
            <div class="stat-label">要克服(×)</div>
          </div>
        </div>

        <label class="field-label" for="deckSelect">科目・単元</label>
        <select id="deckSelect" onchange="updateHomeCount()"></select>

        <label class="field-label">出題フィルター</label>
        <div class="chip-group" id="filterGroup">
          <button class="chip active" data-val="all" onclick="setFilter('all')">すべて</button>
          <button class="chip" data-val="unanswered" onclick="setFilter('unanswered')">未回答のみ</button>
          <button class="chip" data-val="wrong" onclick="setFilter('wrong')">間違えた問題</button>
          <button class="chip" data-val="starred" onclick="setFilter('starred')">★ 要復習</button>
        </div>

        <label class="field-label">出題順</label>
        <div class="chip-group" id="orderGroup">
          <button class="chip active" data-val="seq" onclick="setOrder('seq')">順番どおり</button>
          <button class="chip" data-val="rand" onclick="setOrder('rand')">ランダム</button>
        </div>

        <button class="btn-primary" id="startBtn" onclick="startQuiz()">演習をスタート</button>
        <button class="btn-sub" onclick="resetHistory()">学習履歴をリセット</button>
      </div>
    </section>

    <!-- 演習画面 -->
    <section id="quizView" class="hidden">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="card">
        <div class="quiz-meta">
          <div>
            <span class="badge" id="qTopic"></span>
            <span style="font-size:12px; color:var(--muted); margin-left:6px;" id="qCounter"></span>
          </div>
          <button class="star-btn" id="starBtn" onclick="toggleStar()" aria-label="要復習">★</button>
        </div>

        <div class="q-text" id="qText"></div>

        <div class="ox-bar" id="oxBar">
          <button class="btn-ox btn-o" onclick="answer(true)">◯</button>
          <button class="btn-ox btn-x" onclick="answer(false)">×</button>
        </div>

        <div id="feedbackArea" class="hidden">
          <div class="result-box" id="resultBox">
            <div class="result-title" id="resultTitle"></div>
            <div style="font-size:13px;" id="resultSub"></div>
          </div>

          <div class="explain-card">
            <div class="ref-tag" id="qRef"></div>
            <div id="qExplain" style="white-space:pre-wrap;"></div>
          </div>

          <div class="action-row">
            <a id="issueLink" class="btn-issue" target="_blank" rel="noopener">📝 GitHub Issueにメモ</a>
          </div>

          <button class="btn-primary" id="nextBtn" onclick="nextQuestion()">次の問題へ</button>
        </div>
      </div>
    </section>

    <!-- 完了画面 -->
    <section id="doneView" class="hidden">
      <div class="card" style="text-align:center;">
        <h2 style="margin-top:4px;">セット完了！</h2>
        <p id="doneSummary" style="font-size:16px; font-weight:700; color:var(--primary);"></p>
        <button class="btn-primary" onclick="retryWrong()">このセットの不正解だけ解き直す</button>
        <button class="btn-sub" onclick="showHome()">メニューへ戻る</button>
      </div>
    </section>
  </main>

  <script>
    // ▼ 自分のGitHubリポジトリ名に書き換えると「Issueにメモ」が連動します
    // 例: const GITHUB_REPO = "yourname/shihoshoshi-drill";
    const GITHUB_REPO = "";

    const STORAGE_KEY = "shihoshoshi_drill_history_v1";
    let allQuestions = [];
    let decks = [];
    let history = loadHistory();
    let currentFilter = "all";
    let currentOrder = "seq";
    let sessionList = [];
    let sessionIndex = 0;
    let sessionCorrect = 0;
    let sessionWrongList = [];

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch { return {}; }
    }
    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }

    async function init() {
      try {
        const res = await fetch("./data/index.json", { cache: "no-store" });
        if (!res.ok) throw new Error("data/index.json が読み込めません");
        decks = await res.json();

        const loaded = await Promise.all(
          decks.map(async (d) => {
            const r = await fetch("./data/" + d.file, { cache: "no-store" });
            const qs = await r.json();
            return qs.map(q => ({ ...q, deckId: d.id, deckTitle: d.title }));
          })
        );
        allQuestions = loaded.flat();

        const sel = document.getElementById("deckSelect");
        sel.innerHTML = `<option value="ALL">すべての科目（${allQuestions.length}問）</option>` +
          decks.map(d => {
            const cnt = allQuestions.filter(q => q.deckId === d.id).length;
            return `<option value="${d.id}">${d.title}（${cnt}問）</option>`;
          }).join("");

        updateHomeCount();
      } catch (e) {
        const err = document.getElementById("errorArea");
        err.classList.remove("hidden");
        err.textContent = "問題データの読み込みに失敗しました。GitHub Pages またはローカルサーバー経由で開いてください。（詳細: " + e.message + "）";
      }
    }

    function getFilteredQuestions() {
      const deckId = document.getElementById("deckSelect").value;
      return allQuestions.filter(q => {
        if (deckId !== "ALL" && q.deckId !== deckId) return false;
        const h = history[q.id];
        if (currentFilter === "unanswered") return !h || h.lastCorrect === undefined;
        if (currentFilter === "wrong") return h && h.lastCorrect === false;
        if (currentFilter === "starred") return h && h.starred === true;
        return true;
      });
    }

    function updateHomeCount() {
      const deckId = document.getElementById("deckSelect").value;
      const scope = deckId === "ALL" ? allQuestions : allQuestions.filter(q => q.deckId === deckId);
      const answered = scope.filter(q => history[q.id]?.lastCorrect !== undefined);
      const correct = answered.filter(q => history[q.id].lastCorrect === true);
      const wrong = answered.filter(q => history[q.id].lastCorrect === false);

      document.getElementById("statTotal").textContent = scope.length;
      document.getElementById("statRate").textContent =
        answered.length ? Math.round((correct.length / answered.length) * 100) + "%" : "-";
      document.getElementById("statWrong").textContent = wrong.length;

      const targets = getFilteredQuestions();
      const btn = document.getElementById("startBtn");
      btn.disabled = targets.length === 0;
      btn.textContent = targets.length ? `演習をスタート（${targets.length}問）` : "該当する問題がありません";
    }

    function setFilter(val) {
      currentFilter = val;
      document.querySelectorAll("#filterGroup .chip").forEach(c =>
        c.classList.toggle("active", c.dataset.val === val)
      );
      updateHomeCount();
    }

    function setOrder(val) {
      currentOrder = val;
      document.querySelectorAll("#orderGroup .chip").forEach(c =>
        c.classList.toggle("active", c.dataset.val === val)
      );
    }

    function startQuiz(customList) {
      sessionList = customList ? [...customList] : getFilteredQuestions();
      if (!sessionList.length) return;
      if (currentOrder === "rand") {
        for (let i = sessionList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [sessionList[i], sessionList[j]] = [sessionList[j], sessionList[i]];
        }
      }
      sessionIndex = 0;
      sessionCorrect = 0;
      sessionWrongList = [];

      document.getElementById("homeView").classList.add("hidden");
      document.getElementById("doneView").classList.add("hidden");
      document.getElementById("quizView").classList.remove("hidden");
      document.getElementById("homeBtn").classList.remove("hidden");
      renderQuestion();
    }

    function renderQuestion() {
      const q = sessionList[sessionIndex];
      const pct = ((sessionIndex) / sessionList.length) * 100;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("qTopic").textContent = q.topic || q.deckTitle;
      document.getElementById("qCounter").textContent = `${sessionIndex + 1} / ${sessionList.length}（${q.id}）`;
      document.getElementById("qText").textContent = q.question;

      const starred = !!(history[q.id]?.starred);
      document.getElementById("starBtn").classList.toggle("on", starred);

      document.getElementById("oxBar").classList.remove("hidden");
      document.getElementById("feedbackArea").classList.add("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function answer(userAns) {
      const q = sessionList[sessionIndex];
      const isOk = (userAns === q.answer);
      const prev = history[q.id] || {};
      history[q.id] = {
        ...prev,
        lastCorrect: isOk,
        attempts: (prev.attempts || 0) + 1,
        updatedAt: Date.now()
      };
      saveHistory();

      if (isOk) {
        sessionCorrect++;
      } else {
        sessionWrongList.push(q);
      }

      const box = document.getElementById("resultBox");
      box.className = "result-box " + (isOk ? "ok" : "ng");
      document.getElementById("resultTitle").textContent = isOk ? "正解！" : "不正解…";
      document.getElementById("resultSub").textContent = `正解は「${q.answer ? "◯" : "×"}」`;
      document.getElementById("qRef").textContent = q.ref || "ポイント解説";
      document.getElementById("qExplain").textContent = q.explanation;

      const issueBtn = document.getElementById("issueLink");
      if (GITHUB_REPO) {
        const title = encodeURIComponent(`[復習] ${q.id} ${q.topic}`);
        const body = encodeURIComponent(
          `### 問題\n${q.question}\n\n### 正解\n${q.answer ? "◯" : "×"}\n\n### 根拠・解説\n${q.ref}\n${q.explanation}\n\n### 自分のメモ\n- `
        );
        issueBtn.href = `https://github.com/${GITHUB_REPO}/issues/new?title=${title}&body=${body}`;
        issueBtn.classList.remove("hidden");
      } else {
        issueBtn.classList.add("hidden");
      }

      document.getElementById("nextBtn").textContent =
        sessionIndex + 1 < sessionList.length ? "次の問題へ" : "結果を見る";
      document.getElementById("oxBar").classList.add("hidden");
      document.getElementById("feedbackArea").classList.remove("hidden");
    }

    function toggleStar() {
      const q = sessionList[sessionIndex];
      const prev = history[q.id] || {};
      const nextState = !prev.starred;
      history[q.id] = { ...prev, starred: nextState };
      saveHistory();
      document.getElementById("starBtn").classList.toggle("on", nextState);
    }

    function nextQuestion() {
      sessionIndex++;
      if (sessionIndex < sessionList.length) {
        renderQuestion();
      } else {
        document.getElementById("progressFill").style.width = "100%";
        document.getElementById("quizView").classList.add("hidden");
        document.getElementById("doneView").classList.remove("hidden");
        const rate = Math.round((sessionCorrect / sessionList.length) * 100);
        document.getElementById("doneSummary").textContent =
          `${sessionList.length}問中 ${sessionCorrect}問正解（正答率 ${rate}%）`;
      }
    }

    function retryWrong() {
      if (!sessionWrongList.length) {
        alert("全問正解でした！メニューに戻ります。");
        showHome();
        return;
      }
      startQuiz(sessionWrongList);
    }

    function showHome() {
      document.getElementById("quizView").classList.add("hidden");
      document.getElementById("doneView").classList.add("hidden");
      document.getElementById("homeView").classList.remove("hidden");
      document.getElementById("homeBtn").classList.add("hidden");
      updateHomeCount();
    }

    function resetHistory() {
      if (!confirm("すべての正誤記録と★マークをリセットしますか？")) return;
      history = {};
      saveHistory();
      updateHomeCount();
    }

    init();
  </script>
  <footer style="max-width: 720px; margin: 32px auto 24px; padding: 16px; text-align: center; font-size: 12px; line-height: 1.7; color: #64748b; border-top: 1px solid #e2e8f0;">
    <p style="margin: 0 0 4px;">本アプリは司法書士試験対策の学習用オリジナルドリルです。</p>
    <p style="margin: 0 0 4px;">法改正や正確な条文・判例については、最新の六法・テキスト等でご確認ください。</p>
    <p style="margin: 0;">※学習履歴やチェックはお使いの端末（ブラウザ）内にのみ保存されます。</p>
  </footer>
</body>
</html>
